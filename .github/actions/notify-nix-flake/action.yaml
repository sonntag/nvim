name: Notify Nix Flake
description: Notifies my nix flake at sonntag/nix that there's an update to this flake

runs:
  using: composite
  steps:
    - name: Trigger sonntag/nix update workflow
      run: |
        curl -X POST \
        -H "Accept: application/vnd.github.v3+json" \
        -H "Authorization: token ${{ secrets.TARGET_REPO_PAT }}" \
        https://api.github.com/repos/sonntag/nix/dispatches \
        -d '{"event_type":"nvim-flake-changes"}'
